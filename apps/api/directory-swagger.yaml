openapi: 3.0.3
info:
  title: Directory Category & Services APIs
  description: Public API documentation for retrieving organization categories and services grouped/filtered by category, along with their associated organization data.
  version: 1.0.0
servers:
  - url: http://localhost:3000
    description: Local API Development Server
paths:
  /directory/categories:
    get:
      summary: Retrieve all categories of organizations (lightweight)
      description: |
        Returns a flat list of all service categories defined across verified and visible organizations in the system.
        Each category item includes only the essential details (id, name, imageUrl, price) and a compact summary of the organization offering it.
      operationId: getCategories
      responses:
        '200':
          description: Successfully retrieved categories.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoriesResponse'
              example:
                status: success
                data:
                  categories:
                    - id: 39ace40e-6b42-4a6c-a0c8-73dce60b20e5
                      name: Hair laser
                      imageUrl: http://localhost:3000/uploads/organization-categories/195a1b29630d11cb32dd4e3cbcf10bf32.jpg
                      price: "70.00"
                      organization:
                        _id: cc2708aa-4151-49d9-aebd-ad80d576d51a
                        userId: 4e197dc3-5a47-4ee7-a4d5-ffd92f250f3e
                        name: Fade Station Barbershop
                        subdomain: fade-station
                        location: 217 ascotvale road ascotavle
                        logo: http://localhost:3000/uploads/logo-123.png
                        verified: true
                        rating: 4.5
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /directory/services/category/{category}:
    get:
      summary: Retrieve services filtered by category ID or name (lightweight)
      description: |
        Returns a flat list of services offered under the specified category (either by Category UUID or Category Name).
        Each service detail includes a compact summary of the parent organization.
      operationId: getServicesByCategory
      parameters:
        - name: category
          in: path
          description: The category UUID or the category name (case-insensitive) to filter services by (e.g., '39ace40e-6b42-4a6c-a0c8-73dce60b20e5' or 'Hair laser').
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Successfully retrieved services matching the category.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServicesByCategoryResponse'
              example:
                status: success
                data:
                  services:
                    - id: a7265dd9-fba9-45d4-8faa-49b92d717cf8
                      name: spice cutting
                      description: null
                      basePrice: 100
                      durationMinutes: 60
                      imageUrl: null
                      isActive: true
                      categoryId: 39ace40e-6b42-4a6c-a0c8-73dce60b20e5
                      organization:
                        _id: cc2708aa-4151-49d9-aebd-ad80d576d51a
                        userId: 4e197dc3-5a47-4ee7-a4d5-ffd92f250f3e
                        name: Fade Station Barbershop
                        subdomain: fade-station
                        location: 217 ascotvale road ascotavle
                        logo: http://localhost:3000/uploads/logo-123.png
                        verified: true
                        rating: 4.5
                  total: 1
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  schemas:
    CategoriesResponse:
      type: object
      properties:
        status:
          type: string
          example: success
        data:
          type: object
          properties:
            categories:
              type: array
              items:
                $ref: '#/components/schemas/CategoryDetailedItem'

    CategoryDetailedItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        imageUrl:
          type: string
          format: uri
          nullable: true
        price:
          type: string
          nullable: true
        organization:
          $ref: '#/components/schemas/OrganizationSummary'

    ServicesByCategoryResponse:
      type: object
      properties:
        status:
          type: string
          example: success
        data:
          type: object
          properties:
            services:
              type: array
              items:
                $ref: '#/components/schemas/ServiceWithOrganization'
            total:
              type: integer
              example: 1

    ServiceWithOrganization:
      allOf:
        - $ref: '#/components/schemas/ServiceItem'
        - type: object
          properties:
            organization:
              $ref: '#/components/schemas/OrganizationSummary'

    OrganizationSummary:
      type: object
      properties:
        _id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        name:
          type: string
        subdomain:
          type: string
        location:
          type: string
        logo:
          type: string
          format: uri
          nullable: true
        verified:
          type: boolean
        rating:
          type: number

    ServiceItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
          nullable: true
        basePrice:
          type: number
        durationMinutes:
          type: integer
        imageUrl:
          type: string
          format: uri
          nullable: true
        isActive:
          type: boolean
        categoryId:
          type: string
          format: uuid
          nullable: true

    ErrorResponse:
      type: object
      properties:
        statusCode:
          type: integer
          example: 500
        message:
          type: string
          example: Internal server error
