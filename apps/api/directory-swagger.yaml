openapi: 3.0.3
info:
  title: Directory Category & Services APIs
  description: Public API documentation for retrieving organization categories and services grouped/filtered by category, along with their associated organization data.
  version: 1.0.0
servers:
  - url: http://localhost:3000
    description: Local API Development Server
paths:
  /directory/categories:
    get:
      summary: Retrieve all categories of organizations
      description: |
        Returns a list of all unique categories of verified and visible organizations.
        Each category contains the list of organizations belonging to it, along with their mapped service list and affiliated expert details.
      operationId: getCategories
      responses:
        '200':
          description: Successfully retrieved organization categories.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoriesResponse'
              example:
                status: success
                data:
                  categories:
                    - category: studios
                      organizations:
                        - _id: cc2708aa-4151-49d9-aebd-ad80d576d51a
                          userId: 4e197dc3-5a47-4ee7-a4d5-ffd92f250f3e
                          name: Fade Station Barbershop
                          subdomain: fade-station
                          description: our studio is serving no. of business men
                          tagline: our studio is better than anyone
                          industry: Barber
                          location: 217 ascotvale road ascotavle
                          phone: "+1 (555) 019-2834"
                          logo: http://localhost:3000/uploads/logo-123.png
                          verified: true
                          rating: 4.8
                          memberCount: 3
                          services:
                            - id: a7265dd9-fba9-45d4-8faa-49b92d717cf8
                              name: spice cutting
                              description: null
                              basePrice: 100
                              durationMinutes: 60
                              imageUrl: null
                              isActive: true
                              categoryId: null
                          experts:
                            - _id: 163eb306-0110-493b-ba04-b58cadfd75b3
                              name: John Doe
                              profilePicture: http://localhost:3000/uploads/avatar.png
                              specialization: Hair Stylist
                              rating: 4.8
                              experienceYears: 5
                              location: Ascotvale
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /directory/services/category/{category}:
    get:
      summary: Retrieve services filtered by organization category
      description: |
        Returns a flat list of services offered by organizations that belong to the specified category.
        Each service details include its parent organization's public profile summary (without circular service lists).
      operationId: getServicesByCategory
      parameters:
        - name: category
          in: path
          description: The category name (case-insensitive) of the organizations whose services are being fetched (e.g., 'studios').
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Successfully retrieved services matching the category.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServicesByCategoryResponse'
              example:
                status: success
                data:
                  services:
                    - id: a7265dd9-fba9-45d4-8faa-49b92d717cf8
                      name: spice cutting
                      description: null
                      basePrice: 100
                      durationMinutes: 60
                      imageUrl: null
                      isActive: true
                      categoryId: null
                      organization:
                        _id: cc2708aa-4151-49d9-aebd-ad80d576d51a
                        userId: 4e197dc3-5a47-4ee7-a4d5-ffd92f250f3e
                        name: Fade Station Barbershop
                        subdomain: fade-station
                        description: our studio is serving no. of business men
                        tagline: our studio is better than anyone
                        industry: Barber
                        location: 217 ascotvale road ascotavle
                        logo: http://localhost:3000/uploads/logo-123.png
                        verified: true
                        rating: 4.8
                        memberCount: 3

                  total: 1
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  schemas:
    CategoriesResponse:
      type: object
      properties:
        status:
          type: string
          example: success
        data:
          type: object
          properties:
            categories:
              type: array
              items:
                $ref: '#/components/schemas/CategoryItem'

    CategoryItem:
      type: object
      properties:
        category:
          type: string
          example: studios
        organizations:
          type: array
          items:
            $ref: '#/components/schemas/OrganizationDetailed'

    ServicesByCategoryResponse:
      type: object
      properties:
        status:
          type: string
          example: success
        data:
          type: object
          properties:
            services:
              type: array
              items:
                $ref: '#/components/schemas/ServiceWithOrganization'
            total:
              type: integer
              example: 1

    OrganizationDetailed:
      type: object
      properties:
        _id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        name:
          type: string
        subdomain:
          type: string
        description:
          type: string
        tagline:
          type: string
        industry:
          type: string
        location:
          type: string
        phone:
          type: string
          nullable: true
        logo:
          type: string
          format: uri
          nullable: true
        coverImageUrl:
          type: string
          format: uri
          nullable: true
        verified:
          type: boolean
        memberCount:
          type: integer
        rating:
          type: number
        services:
          type: array
          items:
            $ref: '#/components/schemas/ServiceItem'
        experts:
          type: array
          items:
            $ref: '#/components/schemas/ExpertItem'

    ServiceWithOrganization:
      allOf:
        - $ref: '#/components/schemas/ServiceItem'
        - type: object
          properties:
            organization:
              $ref: '#/components/schemas/OrganizationSummary'

    OrganizationSummary:
      type: object
      properties:
        _id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        name:
          type: string
        subdomain:
          type: string
        description:
          type: string
        tagline:
          type: string
        industry:
          type: string
        location:
          type: string
        logo:
          type: string
          format: uri
          nullable: true
        coverImageUrl:
          type: string
          format: uri
          nullable: true
        verified:
          type: boolean
        memberCount:
          type: integer
        rating:
          type: number

    ServiceItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
          nullable: true
        basePrice:
          type: number
        durationMinutes:
          type: integer
        imageUrl:
          type: string
          format: uri
          nullable: true
        isActive:
          type: boolean
        categoryId:
          type: string
          format: uuid
          nullable: true

    ExpertItem:
      type: object
      properties:
        _id:
          type: string
          format: uuid
        name:
          type: string
        profilePicture:
          type: string
          format: uri
          nullable: true
        specialization:
          type: string
        rating:
          type: number
        experienceYears:
          type: integer
        location:
          type: string

    ErrorResponse:
      type: object
      properties:
        statusCode:
          type: integer
          example: 500
        message:
          type: string
          example: Internal server error
